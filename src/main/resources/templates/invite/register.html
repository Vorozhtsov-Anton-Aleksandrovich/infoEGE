<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${invite.passwordReset} ? 'Новый пароль' : 'Регистрация')}"></head>
<body>
<main class="narrow">
    <h1 th:text="${invite.passwordReset} ? 'Новый пароль' : 'Регистрация'">Регистрация</h1>
    <p th:text="${invite.studentDisplayName}">Имя ученика</p>
    <p class="alert alert-error" th:if="${error}" th:text="${error}">Ошибка</p>

    <form method="post" class="form" th:object="${form}" th:action="@{/invite/{t}(t=${token})}">
        <label th:unless="${invite.passwordReset}">Логин
            <input type="text" th:field="*{login}" required autofocus autocomplete="username"
                   pattern="[A-Za-z0-9._\-]{3,32}">
            <span class="hint">Латинские буквы, цифры, точка, дефис, подчёркивание; от 3 до 32 символов.</span>
            <span class="field-error" th:errors="*{login}"></span>
        </label>
        <p th:if="${invite.passwordReset}">Логин: <strong th:text="${existingLogin}">login</strong></p>
        <label>Пароль
            <input type="password" th:field="*{password}" required minlength="8" maxlength="72" autocomplete="new-password">
            <span class="field-error" th:errors="*{password}"></span>
        </label>
        <label>Пароль ещё раз
            <input type="password" th:field="*{passwordConfirm}" required autocomplete="new-password">
            <span class="field-error" th:errors="*{passwordConfirm}"></span>
        </label>
        <button type="submit" th:text="${invite.passwordReset} ? 'Сохранить пароль' : 'Зарегистрироваться'">Зарегистрироваться</button>
    </form>
</main>
</body>
</html>
