<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Мои работы')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h1>Мои работы</h1>
    <p>Здравствуйте, <span sec:authentication="principal.displayName">Имя</span>.</p>

    <p th:if="${works.isEmpty()}">Пока вам ничего не назначено.</p>
    <div class="cards" th:unless="${works.isEmpty()}">
        <article class="card" th:each="w : ${works}" th:with="a=${w.assignment}">
            <h2><a th:href="@{/student/assignments/{id}(id=${a.id})}" th:text="${a.taskSet.title}">Название</a></h2>
            <p class="hint">
                <span th:text="${a.taskSet.type.name() == 'VARIANT'} ? 'Вариант' : 'Подборка'">Подборка</span>
                · заданий: <span th:text="${a.taskSet.items.size()}">0</span>
                <th:block th:if="${a.taskSet.timeLimitMinutes != null}">
                    · время: <span th:text="${a.taskSet.timeLimitMinutes}">0</span> мин
                </th:block>
            </p>
            <p>Срок: <span th:text="${a.deadlineAt == null} ? 'без срока' : ${@dates.format(a.deadlineAt)}">дата</span></p>
            <p><span class="status" th:classappend="'status-' + ${w.status.name().toLowerCase()}" th:text="${w.status.label}">не начато</span>
                <a th:if="${w.resultsVisible}" th:href="@{/student/assignments/{id}/result(id=${a.id})}">
                    результаты: <span th:text="${w.attempt.finalScore}">0</span></a></p>
        </article>
    </div>
</main>
</body>
</html>
