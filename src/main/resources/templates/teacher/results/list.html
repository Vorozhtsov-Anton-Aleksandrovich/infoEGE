<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Результаты')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div class="page-title">
        <h1>Результаты</h1>
        <div class="actions">
            <a class="button" th:href="@{/teacher/results.csv(setId=${setId}, studentId=${studentId})}">CSV: сводка</a>
            <a class="button" th:href="@{/teacher/results/tasks.csv(setId=${setId}, studentId=${studentId})}">CSV: по заданиям</a>
        </div>
    </div>

    <form class="filters" method="get" th:action="@{/teacher/results}">
        <label>Работа
            <select name="setId">
                <option value="">Все</option>
                <option th:each="s : ${sets}" th:value="${s.id}" th:text="${s.title}" th:selected="${s.id == setId}">Работа</option>
            </select>
        </label>
        <label>Ученик
            <select name="studentId">
                <option value="">Все</option>
                <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.displayName}" th:selected="${s.id == studentId}">Имя</option>
            </select>
        </label>
        <button type="submit">Показать</button>
        <a th:href="@{/teacher/results}">Сбросить</a>
    </form>

    <p th:if="${results.isEmpty()}">Назначений нет.</p>
    <th:block th:unless="${results.isEmpty()}">
        <table th:replace="~{fragments/results :: table(${results}, true, true, false)}"></table>
    </th:block>
</main>
</body>
</html>
