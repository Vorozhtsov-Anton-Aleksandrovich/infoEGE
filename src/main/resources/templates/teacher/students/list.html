<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ученики')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h1>Ученики</h1>
    <div th:replace="~{fragments/messages :: flash}"></div>

    <section class="panel">
        <h2>Пригласить ученика</h2>
        <form class="form-row" method="post" th:action="@{/teacher/students/invites}">
            <label class="grow">Имя ученика (так его увидите вы)
                <input type="text" name="displayName" required maxlength="200" placeholder="Иван Петров">
            </label>
            <button type="submit">Создать ссылку</button>
        </form>
    </section>

    <section class="panel" th:unless="${invites.isEmpty()}">
        <h2>Приглашения без регистрации</h2>
        <table class="table">
            <thead><tr><th>Имя</th><th>Создано</th><th>Действует до</th><th></th></tr></thead>
            <tbody>
            <tr th:each="i : ${invites}" th:classappend="${i.expired} ? 'muted'">
                <td th:text="${i.studentDisplayName}">Имя</td>
                <td th:text="${@dates.format(i.createdAt)}">дата</td>
                <td th:text="${i.expired} ? 'истекло' : ${@dates.format(i.expiresAt)}">дата</td>
                <td class="actions">
                    <form method="post" th:action="@{/teacher/students/invites/{id}/reissue(id=${i.id})}">
                        <button type="submit" class="link-button">Новая ссылка</button>
                    </form>
                    <form method="post" th:action="@{/teacher/students/invites/{id}/delete(id=${i.id})}"
                          data-confirm="Отозвать приглашение?">
                        <button type="submit" class="link-button danger">Отозвать</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <section class="panel">
        <h2>Зарегистрированные</h2>
        <p th:if="${students.isEmpty()}">Пока никого.</p>
        <table class="table" th:unless="${students.isEmpty()}">
            <thead><tr><th>Имя</th><th>Логин</th><th>С нами с</th><th>Статус</th></tr></thead>
            <tbody>
            <tr th:each="s : ${students}" th:classappend="${!s.active} ? 'muted'">
                <td><a th:href="@{/teacher/students/{id}(id=${s.id})}" th:text="${s.displayName}">Имя</a></td>
                <td th:text="${s.login}">login</td>
                <td th:text="${@dates.format(s.createdAt)}">дата</td>
                <td th:text="${s.active} ? 'активен' : 'деактивирован'">активен</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
