<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход')}"></head>
<body>
<main class="narrow">
    <h1>Вход</h1>
    <p class="alert alert-error" th:if="${param.error}">Неверный логин или пароль.</p>
    <p class="alert alert-info" th:if="${param.logout}">Вы вышли из системы.</p>
    <p class="alert alert-info" th:if="${param.registered}">Регистрация завершена. Войдите с новым логином и паролем.</p>
    <p class="alert alert-info" th:if="${param.passwordChanged}">Пароль изменён. Войдите с новым паролем.</p>
    <p class="alert alert-info" th:if="${param.expired}">Сеанс завершён. Войдите снова.</p>
    <form th:action="@{/login}" method="post" class="form">
        <label>Логин
            <input type="text" name="username" required autofocus autocomplete="username">
        </label>
        <label>Пароль
            <input type="password" name="password" required autocomplete="current-password">
        </label>
        <button type="submit">Войти</button>
    </form>
</main>
</body>
</html>
