<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c92a2a"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c62c9"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b8a3e"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#868e96"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker></defs>
<text x="20" y="28" font-size="16" fill="#1d3557" font-weight="bold" text-anchor="start" xml:space="preserve">Код: А = 0, Б = 01, В = 10. Как прочитать 010?</text><rect x="40" y="60" width="44" height="40" rx="6" fill="#d0ebff" stroke="#1c62c9" stroke-width="1.5"/><text x="62.0" y="88" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0</text><text x="62.0" y="126" font-size="18" fill="#1c62c9" font-weight="bold" text-anchor="middle" xml:space="preserve">А</text><rect x="90" y="60" width="78" height="40" rx="6" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.5"/><text x="129.0" y="88" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">10</text><text x="129.0" y="126" font-size="18" fill="#e8590c" font-weight="bold" text-anchor="middle" xml:space="preserve">В</text><text x="220" y="88" font-size="20" fill="#1d3557" font-weight="bold" text-anchor="start" xml:space="preserve">→ АВ</text><rect x="40" y="160" width="78" height="40" rx="6" fill="#d0ebff" stroke="#1c62c9" stroke-width="1.5"/><text x="79.0" y="188" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">01</text><text x="79.0" y="226" font-size="18" fill="#1c62c9" font-weight="bold" text-anchor="middle" xml:space="preserve">Б</text><rect x="124" y="160" width="44" height="40" rx="6" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.5"/><text x="146.0" y="188" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0</text><text x="146.0" y="226" font-size="18" fill="#e8590c" font-weight="bold" text-anchor="middle" xml:space="preserve">А</text><text x="220" y="188" font-size="20" fill="#1d3557" font-weight="bold" text-anchor="start" xml:space="preserve">→ БА</text><text x="380" y="120" font-size="16" fill="#c92a2a" font-weight="bold" text-anchor="start" xml:space="preserve">Две разные расшифровки!</text><text x="380" y="145" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">Причина: код А = 0 —</text><text x="380" y="165" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">начало кода Б = 01.</text>
