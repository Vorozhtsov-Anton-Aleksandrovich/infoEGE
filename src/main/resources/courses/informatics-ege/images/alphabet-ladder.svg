<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" font-family="Segoe UI, Arial, sans-serif">
<rect width="660" height="300" fill="#ffffff"/>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c92a2a"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c62c9"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b8a3e"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#868e96"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker></defs>
<text x="20" y="28" font-size="16" fill="#1d3557" font-weight="bold" text-anchor="start" xml:space="preserve">Алфавит из 36 символов: между какими ступеньками?</text><rect x="30" y="240" width="110" height="40" rx="4" fill="#d0ebff" stroke="#1c62c9" stroke-width="1.5"/><text x="85" y="266" font-size="16" fill="#1c62c9" font-weight="bold" text-anchor="middle" xml:space="preserve">2³ = 8</text><rect x="150" y="200" width="110" height="40" rx="4" fill="#d0ebff" stroke="#1c62c9" stroke-width="1.5"/><text x="205" y="226" font-size="16" fill="#1c62c9" font-weight="bold" text-anchor="middle" xml:space="preserve">2⁴ = 16</text><rect x="270" y="160" width="110" height="40" rx="4" fill="#d0ebff" stroke="#1c62c9" stroke-width="1.5"/><text x="325" y="186" font-size="16" fill="#1c62c9" font-weight="bold" text-anchor="middle" xml:space="preserve">2⁵ = 32</text><rect x="390" y="120" width="110" height="40" rx="4" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/><text x="445" y="146" font-size="16" fill="#2b8a3e" font-weight="bold" text-anchor="middle" xml:space="preserve">2⁶ = 64</text><rect x="510" y="80" width="110" height="40" rx="4" fill="#d0ebff" stroke="#1c62c9" stroke-width="1.5"/><text x="565" y="106" font-size="16" fill="#1c62c9" font-weight="bold" text-anchor="middle" xml:space="preserve">2⁷ = 128</text><circle cx="390" cy="190" r="22" fill="#ffe8cc" stroke="#e8590c" stroke-width="2.5"/><text x="390" y="196" font-size="16" fill="#e8590c" font-weight="bold" text-anchor="middle" xml:space="preserve">36</text><line x1="390" y1="168" x2="410" y2="150" stroke="#e8590c" stroke-width="2" marker-end="url(#ar-orange)"/><text x="430" y="150" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start" xml:space="preserve">32 &lt; 36 ≤ 64</text><text x="430" y="172" font-size="14" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">берём верхнюю ступеньку:</text><text x="430" y="194" font-size="15" fill="#2b8a3e" font-weight="bold" text-anchor="start" xml:space="preserve">6 бит на символ</text>
</svg>
