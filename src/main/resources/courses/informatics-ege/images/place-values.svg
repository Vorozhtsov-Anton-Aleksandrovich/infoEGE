<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Segoe UI, Arial, sans-serif">
<rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c92a2a"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c62c9"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b8a3e"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#868e96"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker></defs>
<text x="20" y="30" font-size="15" fill="#1d3557" font-weight="bold" text-anchor="start" xml:space="preserve">Десятичная система: веса 1, 10, 100</text><text x="95" y="60" font-size="13" fill="#868e96" font-weight="normal" text-anchor="middle" xml:space="preserve">10² = 100</text><rect x="60" y="70" width="70" height="56" rx="8" fill="#d0ebff" stroke="#1c62c9" stroke-width="1.5"/><text x="95.0" y="108.8" font-size="30" fill="#1c62c9" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3</text><text x="95" y="152" font-size="15" fill="#1c62c9" font-weight="bold" text-anchor="middle" xml:space="preserve">3·100</text><text x="185" y="60" font-size="13" fill="#868e96" font-weight="normal" text-anchor="middle" xml:space="preserve">10¹ = 10</text><rect x="150" y="70" width="70" height="56" rx="8" fill="#d0ebff" stroke="#1c62c9" stroke-width="1.5"/><text x="185.0" y="108.8" font-size="30" fill="#1c62c9" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">4</text><text x="185" y="152" font-size="15" fill="#1c62c9" font-weight="bold" text-anchor="middle" xml:space="preserve">4·10</text><text x="275" y="60" font-size="13" fill="#868e96" font-weight="normal" text-anchor="middle" xml:space="preserve">10⁰ = 1</text><rect x="240" y="70" width="70" height="56" rx="8" fill="#d0ebff" stroke="#1c62c9" stroke-width="1.5"/><text x="275.0" y="108.8" font-size="30" fill="#1c62c9" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5</text><text x="275" y="152" font-size="15" fill="#1c62c9" font-weight="bold" text-anchor="middle" xml:space="preserve">5·1</text><text x="340" y="115" font-size="18" fill="#1c62c9" font-weight="bold" text-anchor="start" xml:space="preserve">= 300 + 40 + 5 = 345</text><text x="20" y="200" font-size="15" fill="#1d3557" font-weight="bold" text-anchor="start" xml:space="preserve">Двоичная система: веса 1, 2, 4, 8</text><text x="95" y="230" font-size="13" fill="#868e96" font-weight="normal" text-anchor="middle" xml:space="preserve">2³ = 8</text><rect x="60" y="240" width="70" height="56" rx="8" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.5"/><text x="95.0" y="278.8" font-size="30" fill="#e8590c" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text><text x="95" y="322" font-size="15" fill="#e8590c" font-weight="bold" text-anchor="middle" xml:space="preserve">1·8</text><text x="185" y="230" font-size="13" fill="#868e96" font-weight="normal" text-anchor="middle" xml:space="preserve">2² = 4</text><rect x="150" y="240" width="70" height="56" rx="8" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.5"/><text x="185.0" y="278.8" font-size="30" fill="#e8590c" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0</text><text x="185" y="322" font-size="15" fill="#e8590c" font-weight="bold" text-anchor="middle" xml:space="preserve">0·4</text><text x="275" y="230" font-size="13" fill="#868e96" font-weight="normal" text-anchor="middle" xml:space="preserve">2¹ = 2</text><rect x="240" y="240" width="70" height="56" rx="8" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.5"/><text x="275.0" y="278.8" font-size="30" fill="#e8590c" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text><text x="275" y="322" font-size="15" fill="#e8590c" font-weight="bold" text-anchor="middle" xml:space="preserve">1·2</text><text x="365" y="230" font-size="13" fill="#868e96" font-weight="normal" text-anchor="middle" xml:space="preserve">2⁰ = 1</text><rect x="330" y="240" width="70" height="56" rx="8" fill="#ffe8cc" stroke="#e8590c" stroke-width="1.5"/><text x="365.0" y="278.8" font-size="30" fill="#e8590c" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text><text x="365" y="322" font-size="15" fill="#e8590c" font-weight="bold" text-anchor="middle" xml:space="preserve">1·1</text><text x="430" y="285" font-size="18" fill="#e8590c" font-weight="bold" text-anchor="start" xml:space="preserve">= 8 + 0 + 2 + 1 = 11</text><text x="20" y="360" font-size="14" fill="#868e96" font-weight="normal" text-anchor="start" xml:space="preserve">Вес разряда растёт справа налево: каждый следующий в q раз больше.</text>
</svg>
