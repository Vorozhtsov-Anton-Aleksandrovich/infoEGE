<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Segoe UI, Arial, sans-serif">
<rect width="760" height="320" fill="#ffffff"/>
<defs><marker id="ar-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328"/></marker><marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c92a2a"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c62c9"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2b8a3e"/></marker><marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#868e96"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8590c"/></marker></defs>
<text x="20" y="30" font-size="17" fill="#1d3557" font-weight="bold" text-anchor="start" xml:space="preserve">Обещание: «Если сдам ЕГЭ, то куплю торт»</text><rect x="20" y="60" width="720" height="52" rx="8" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/><text x="40" y="93" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ЕГЭ = 0</text><text x="170" y="93" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">торт = 0</text><text x="320" y="93" font-size="16" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">не сдал, торта нет</text><text x="580" y="93" font-size="17" fill="#2b8a3e" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0 → 0 = 1</text><text x="730" y="80" font-size="13" fill="#2b8a3e" font-weight="bold" text-anchor="end" xml:space="preserve">честно</text><rect x="20" y="122" width="720" height="52" rx="8" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/><text x="40" y="155" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ЕГЭ = 0</text><text x="170" y="155" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">торт = 1</text><text x="320" y="155" font-size="16" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">не сдал, но торт купил</text><text x="580" y="155" font-size="17" fill="#2b8a3e" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0 → 1 = 1</text><text x="730" y="142" font-size="13" fill="#2b8a3e" font-weight="bold" text-anchor="end" xml:space="preserve">не запрещалось</text><rect x="20" y="184" width="720" height="52" rx="8" fill="#ffe3e3" stroke="#c92a2a" stroke-width="1.5"/><text x="40" y="217" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ЕГЭ = 1</text><text x="170" y="217" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">торт = 0</text><text x="320" y="217" font-size="16" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">сдал, а торта нет</text><text x="580" y="217" font-size="17" fill="#c92a2a" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1 → 0 = 0</text><text x="730" y="204" font-size="13" fill="#c92a2a" font-weight="bold" text-anchor="end" xml:space="preserve">обман!</text><rect x="20" y="246" width="720" height="52" rx="8" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1.5"/><text x="40" y="279" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">ЕГЭ = 1</text><text x="170" y="279" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">торт = 1</text><text x="320" y="279" font-size="16" fill="#1f2328" font-weight="normal" text-anchor="start" xml:space="preserve">сдал и купил торт</text><text x="580" y="279" font-size="17" fill="#2b8a3e" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1 → 1 = 1</text><text x="730" y="266" font-size="13" fill="#2b8a3e" font-weight="bold" text-anchor="end" xml:space="preserve">честно</text>
</svg>
