<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5484d"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker></defs><rect x="20" y="80" width="120" height="50" rx="8" fill="#ffe8a3" stroke="#c99a2e" stroke-width="1.5"/><text x="80.0" y="111.3" font-size="18" fill="#222" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">x = 5</text><line x1="140" y1="105" x2="200" y2="105" stroke="#333" stroke-width="1.8" marker-end="url(#arrb)"/><rect x="200" y="40" width="280" height="130" rx="12" fill="#e7f5ff" stroke="#2f6fdb" stroke-width="2"/><text x="216" y="70" font-size="16" fill="#2f6fdb" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">def square(x):</text><text x="240" y="110" font-size="16" fill="#222" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">return x * x</text><text x="216" y="155" font-size="13" fill="#555" font-weight="normal" text-anchor="start" xml:space="preserve">тело функции</text><line x1="480" y1="105" x2="540" y2="105" stroke="#333" stroke-width="1.8" marker-end="url(#arrb)"/><rect x="540" y="80" width="120" height="50" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/><text x="600.0" y="112.7" font-size="22" fill="#222" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">25</text><text x="20" y="160" font-size="13" fill="#555" font-weight="normal" text-anchor="start" xml:space="preserve">аргумент</text><text x="545" y="160" font-size="13" fill="#555" font-weight="normal" text-anchor="start" xml:space="preserve">результат</text><text x="20" y="215" font-size="16" fill="#333" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(square(5))  # 25</text>
