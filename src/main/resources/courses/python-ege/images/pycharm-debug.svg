<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5484d"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker></defs><rect x="20" y="20" width="720" height="380" rx="8" fill="#2b2d30" stroke="#adb5bd"/><path d="M20 28 a8 8 0 0 1 8 -8 h704 a8 8 0 0 1 8 8 v22 h-720 z" fill="#1e1f22"/><text x="32" y="40" font-size="13" fill="#dfe1e5" font-weight="normal" text-anchor="start" xml:space="preserve">ege – task5.py [Debug]</text><text x="670" y="40" font-size="12" fill="#dfe1e5" font-weight="normal" text-anchor="start" xml:space="preserve">—   ☐   ✕</text><text x="64" y="80" font-size="13" fill="#6f737a" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text><text x="90" y="80" font-size="14" fill="#dfe1e5" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">s = 0</text><text x="64" y="104" font-size="13" fill="#6f737a" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">2</text><text x="90" y="104" font-size="14" fill="#dfe1e5" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for n in range(1, 6):</text><rect x="60" y="112" width="680" height="22" fill="#2d4a7a"/><circle cx="48" cy="123" r="7" fill="#e5484d"/><text x="64" y="128" font-size="13" fill="#6f737a" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">3</text><text x="90" y="128" font-size="14" fill="#dfe1e5" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    s += n * n</text><text x="64" y="152" font-size="13" fill="#6f737a" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">4</text><text x="90" y="152" font-size="14" fill="#dfe1e5" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">print(s)</text><rect x="20" y="200" width="720" height="200" fill="#1e1f22"/><text x="32" y="222" font-size="12" fill="#a9b7c6" font-weight="normal" text-anchor="start" xml:space="preserve">Debug: task5   Threads &amp; Variables   Console</text><text x="40" y="248" font-size="13" fill="#8ec07c" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">▶ F9   ⤼ F8   ↓ F7</text><text x="60" y="280" font-size="14" fill="#dfe1e5" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">s = {int} 5</text><text x="60" y="306" font-size="14" fill="#dfe1e5" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">n = {int} 3</text><line x1="80" y1="185" x2="46" y2="132" stroke="#e5484d" stroke-width="2" marker-end="url(#arr)"/><rect x="76" y="167" width="285" height="26" rx="6" fill="#e5484d"/><text x="86" y="185" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" xml:space="preserve">Точка останова: клик слева от строки</text><line x1="420" y1="300" x2="200" y2="290" stroke="#2f6fdb" stroke-width="2" marker-end="url(#arrb)"/><rect x="416" y="282" width="230" height="26" rx="6" fill="#2f6fdb"/><text x="426" y="300" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" xml:space="preserve">Текущие значения переменных</text><line x1="420" y1="250" x2="185" y2="245" stroke="#e5484d" stroke-width="2" marker-end="url(#arr)"/><rect x="416" y="232" width="215" height="26" rx="6" fill="#e5484d"/><text x="426" y="250" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" xml:space="preserve">F8 — выполнить одну строку</text>
