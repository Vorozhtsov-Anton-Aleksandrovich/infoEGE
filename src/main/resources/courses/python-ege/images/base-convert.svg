<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260" font-family="Segoe UI, Arial, sans-serif">
<rect width="680" height="260" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e5484d"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker></defs><text x="20" y="30" font-size="18" fill="#2f6fdb" font-weight="bold" text-anchor="start" xml:space="preserve">11 → двоичная система</text><text x="40" y="65" font-size="16" fill="#222" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">11 // 2 = 5</text><text x="200" y="65" font-size="16" fill="#555" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">остаток 11 % 2 =</text><rect x="370" y="45" width="30" height="28" rx="5" fill="#ffe8a3" stroke="#c99a2e"/><text x="385" y="65" font-size="17" fill="#222" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text><text x="40" y="105" font-size="16" fill="#222" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"> 5 // 2 = 2</text><text x="200" y="105" font-size="16" fill="#555" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">остаток 5 % 2 =</text><rect x="370" y="85" width="30" height="28" rx="5" fill="#ffe8a3" stroke="#c99a2e"/><text x="385" y="105" font-size="17" fill="#222" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text><text x="40" y="145" font-size="16" fill="#222" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"> 2 // 2 = 1</text><text x="200" y="145" font-size="16" fill="#555" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">остаток 2 % 2 =</text><rect x="370" y="125" width="30" height="28" rx="5" fill="#ffe8a3" stroke="#c99a2e"/><text x="385" y="145" font-size="17" fill="#222" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">0</text><text x="40" y="185" font-size="16" fill="#222" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve"> 1 // 2 = 0</text><text x="200" y="185" font-size="16" fill="#555" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">остаток 1 % 2 =</text><rect x="370" y="165" width="30" height="28" rx="5" fill="#ffe8a3" stroke="#c99a2e"/><text x="385" y="185" font-size="17" fill="#222" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">1</text><path d="M420 190 C 470 150, 470 90, 420 50" fill="none" stroke="#e5484d" stroke-width="2.5" marker-end="url(#arr)"/><text x="470" y="120" font-size="14" fill="#e5484d" font-weight="bold" text-anchor="start" xml:space="preserve">читаем снизу вверх</text><text x="20" y="240" font-size="17" fill="#333" font-weight="bold" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">11₁₀ = 1011₂        int(&#x27;1011&#x27;, 2) = 11</text>
</svg>
