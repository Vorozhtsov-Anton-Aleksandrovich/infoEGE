th="1.5"/><text x="408.0" y="92.0" font-size="20" fill="#222" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">5</text><rect x="450" y="60" width="56" height="50" rx="8" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.5"/><text x="478.0" y="92.0" font-size="20" fill="#222" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">6</text><rect x="520" y="60" width="56" height="50" rx="8" fill="#f1f3f5" stroke="#ced4da" stroke-width="1.5"/><text x="548.0" y="92.0" font-size="20" fill="#adb5bd" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">7</text><rect x="590" y="60" width="56" height="50" rx="8" fill="#f1f3f5" stroke="#ced4da" stroke-width="1.5"/><text x="618.0" y="92.0" font-size="20" fill="#adb5bd" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">8</text><text x="198" y="135" font-size="13" fill="#2f9e44" font-weight="bold" text-anchor="middle" xml:space="preserve">начало (входит)</text><text x="548" y="135" font-size="13" fill="#e5484d" font-weight="bold" text-anchor="middle" xml:space="preserve">конец (НЕ входит)</text><line x1="548" y1="118" x2="548" y2="112" stroke="#e5484d"/><text x="20" y="175" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">for i in range(2, 7):  →  i = 2, 3, 4, 5, 6   (5 шагов = 7 − 2)</text><text x="20" y="205" font-size="15" fill="#333" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">range(1, n + 1)  →  от 1 до n включительно</text>
