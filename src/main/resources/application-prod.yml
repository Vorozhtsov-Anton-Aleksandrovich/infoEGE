# Продакшен: приложение за Caddy (HTTPS терминируется на Caddy).
server:
  # Tomcat RemoteIpValve берёт IP клиента и схему из X-Forwarded-* только от внутренних адресов
  # (сеть Docker), поэтому ограничение попыток входа видит настоящий IP.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

spring:
  # Без значений по умолчанию: если переменная не задана, приложение не запустится.
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  thymeleaf:
    cache: true

app:
  teacher:
    # Пароль преподавателя не короче 12 символов и не совпадает с логином.
    require-strong-password: true

logging:
  level:
    root: INFO
    com.github.anton.infoege: INFO
