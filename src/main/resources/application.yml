spring:
  application:
    name: InfoEGE
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/infoege}
    username: ${DB_USER:infoege}
    password: ${DB_PASSWORD:infoege}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  thymeleaf:
    cache: true
  servlet:
    multipart:
      # Лимит одного файла проверяет FileValidator; здесь только общий потолок запроса.
      max-file-size: ${app.storage.max-file-size}
      max-request-size: 200MB

server:
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  teacher:
    login: ${TEACHER_LOGIN:}
    password: ${TEACHER_PASSWORD:}
    display-name: ${TEACHER_NAME:Преподаватель}
  storage:
    dir: ${STORAGE_DIR:./data/files}
    max-file-size: ${MAX_FILE_SIZE:20MB}
    attachment-extensions: txt,csv,py,pdf,doc,docx,odt,xls,xlsx,ods,zip,png,jpg,jpeg
    image-extensions: png,jpg,jpeg,gif,webp
