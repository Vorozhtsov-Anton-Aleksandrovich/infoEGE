# Продакшен на VPS: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Наружу открыты только 80 и 443 (Caddy). БД и приложение доступны лишь внутри сети Docker.
# Обязательные переменные из .env проверяются при запуске: без них compose остановится с ошибкой.
name: infoege

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    # Образ собирается на сервере (--build) или берётся из реестра (docker compose pull app).
    build: .
    image: ${IMAGE:-infoege}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?задайте POSTGRES_DB в .env}
      DB_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      TEACHER_LOGIN: ${TEACHER_LOGIN:?задайте TEACHER_LOGIN в .env}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:?задайте TEACHER_PASSWORD в .env}
      TEACHER_NAME: ${TEACHER_NAME:-Преподаватель}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-20MB}
    volumes:
      - app-files:/app/data
    expose:
      - "8080"
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:?задайте ACME_EMAIL в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

volumes:
  db-data:
  app-files:
  caddy-data:
  caddy-config:
