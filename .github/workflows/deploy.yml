# Деплой после успешного CI на main: сборка образа в GHCR и обновление VPS по SSH.
# Нужны (Settings → Secrets and variables → Actions):
#   variables: DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH (например /opt/infoege), DEPLOY_DOMAIN (домен сайта)
#   secrets:   DEPLOY_SSH_KEY (приватный ключ), DEPLOY_KNOWN_HOSTS (вывод ssh-keyscan сервера)
# Пока DEPLOY_HOST не задан, workflow ничего не делает.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    if: >-
      vars.DEPLOY_HOST != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/infoege" >> "$GITHUB_OUTPUT"
          echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy compose file, Caddyfile and scripts
        env:
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml Caddyfile "$TARGET:$DEPLOY_PATH/"
          scp -i ~/.ssh/deploy_key scripts/backup.sh scripts/restore.sh "$TARGET:$DEPLOY_PATH/scripts/"

      - name: Backup and update
        env:
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          ssh -i ~/.ssh/deploy_key "$TARGET" bash -s -- "$DEPLOY_PATH" "$IMAGE" "$TAG" <<'EOF'
          set -euo pipefail
          cd "$1"
          chmod +x scripts/*.sh
          # Записываем версию в .env, чтобы ручной docker compose up запускал ту же версию.
          sed -i -E "s|^IMAGE=.*|IMAGE=$2|; s|^IMAGE_TAG=.*|IMAGE_TAG=$3|" .env
          # Бэкап перед обновлением: миграции Flyway необратимы. На самом первом деплое БД ещё нет.
          if docker compose -f docker-compose.prod.yml --env-file .env ps --status running db | grep -q db; then
            scripts/backup.sh
          fi
          docker compose -f docker-compose.prod.yml --env-file .env pull app
          docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
          docker image prune -f
          EOF

      - name: Health check
        env:
          DOMAIN_URL: https://${{ vars.DEPLOY_DOMAIN || vars.DEPLOY_HOST }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$DOMAIN_URL/actuator/health" | grep -q '"UP"'; then echo "UP"; exit 0; fi
            sleep 5
          done
          echo "Application did not become healthy" >&2
          exit 1
